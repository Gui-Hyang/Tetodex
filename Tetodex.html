    <script>
        // Pokédex State Variables
        const POKEAPI_BASE = 'https://pokeapi.co/api/v2';
        const LIMIT = 30;
        let offset = 0;
        let isLoading = false;
        let allLoadedPokemon = [];
        let isShinyMode = false;
        let currentSpeciesData = null;
        let currentVarietyData = null;
        let spriteUrls = [];
        let currentSpriteIndex = 0;

        // DOM Elements
        let modal, searchInput, clearSearchBtn, loadingContainer, grid, loadedCount, loadMoreBtn;

        // Player de Música Spotify-Style State
        const tetoPlaylist = [
            {
                title: 'Override (オーバーライド)',
                artist: 'Kasane Teto (Yoshida Yasei)',
                cover: 'https://images.fineartamerica.com/images/artworkimages/medium/3/kasane-teto-vocaloid-anime-pop-art-transparent.png',
                src: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=synthwave-vocal-groove-112199.mp3'
            },
            {
                title: 'Mesmerizer (メズマライザー)',
                artist: 'Kasane Teto & Hatsune Miku',
                cover: 'https://placehold.co/150/e60033/ffffff?text=Mesmerizer',
                src: 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=cyberpunk-vocal-beat-18683.mp3'
            },
            {
                title: 'Kasane Territory',
                artist: 'Kasane Teto (Kero 9 Destiny)',
                cover: 'https://placehold.co/150/80001c/ffffff?text=Territory',
                src: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a1668e.mp3?filename=fast-jp-synth-10118.mp3'
            },
            {
                title: 'Tetoris (テトリス)',
                artist: 'Kasane Teto Original',
                cover: 'https://placehold.co/150/b30024/ffffff?text=Tetoris',
                src: 'https://cdn.pixabay.com/download/audio/2022/10/14/audio_99393165b4.mp3?filename=anime-game-theme-1234.mp3'
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let audioElement, playBtn, playIcon, seekBar, currentTimeEl, durationTimeEl, volumeBar, vinylSpin;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            // Inicialização dos elementos do DOM
            modal = document.getElementById('pokemon-modal');
            searchInput = document.getElementById('search-input');
            clearSearchBtn = document.getElementById('clear-search');
            loadingContainer = document.getElementById('loading-container');
            grid = document.getElementById('pokemon-grid');
            loadedCount = document.getElementById('loaded-count');
            loadMoreBtn = document.getElementById('load-more-btn');

            // Inicializar Audio Player Spotify
            initAudioPlayer();

            fetchPokemonList();

            // Real-time Search Filter Event (com verificação de segurança)
            if (searchInput) {
                searchInput.addEventListener('input', handleSearch);
            }

            // Fechar ao clicar fora do container do modal (se modal existir)
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
            }
        });

        function initAudioPlayer() {
            audioElement = document.getElementById('audio-element');
            playBtn = document.getElementById('play-pause-btn');
            playIcon = document.getElementById('play-icon');
            seekBar = document.getElementById('seek-bar');
            currentTimeEl = document.getElementById('current-time');
            durationTimeEl = document.getElementById('duration-time');
            volumeBar = document.getElementById('volume-bar');
            vinylSpin = document.getElementById('vinyl-spin');

            loadTrack(currentTrackIndex);

            // Suporte para recarregar fontes com redundância de erro
            audioElement.addEventListener('error', (e) => {
                console.warn("Erro ao carregar fonte de áudio. Tentando próxima faixa...");
            });

            // Timeupdate para atualizar a barra de progresso
            audioElement.addEventListener('timeupdate', () => {
                if (audioElement.duration) {
                    const progress = (audioElement.currentTime / audioElement.duration) * 100;
                    seekBar.value = progress;
                    currentTimeEl.innerText = formatTime(audioElement.currentTime);
                    durationTimeEl.innerText = formatTime(audioElement.duration);
                }
            });

            // SeekBar Event
            seekBar.addEventListener('input', () => {
                if (audioElement.duration) {
                    audioElement.currentTime = (seekBar.value / 100) * audioElement.duration;
                }
            });

            // Volume Event
            volumeBar.addEventListener('input', () => {
                audioElement.volume = volumeBar.value / 100;
            });

            // Quando a música terminar, passa pra próxima
            audioElement.addEventListener('ended', () => {
                nextTrack();
            });
        }

        function loadTrack(index) {
            const track = tetoPlaylist[index];
            document.getElementById('track-title').innerText = track.title;
            document.getElementById('track-artist').innerText = track.artist;
            document.getElementById('track-cover').src = track.cover;
            document.getElementById('track-index-display').innerText = `${index + 1}/${tetoPlaylist.length}`;
            
            audioElement.src = track.src;
            audioElement.load();
        }

        function togglePlay() {
            if (isPlaying) {
                audioElement.pause();
                playIcon.className = 'fa-solid fa-play ml-0.5';
                vinylSpin.classList.add('opacity-0');
                isPlaying = false;
            } else {
                audioElement.play().then(() => {
                    playIcon.className = 'fa-solid fa-pause';
                    vinylSpin.classList.remove('opacity-0');
                    isPlaying = true;
                }).catch(err => {
                    console.log("Clique no botão de Play para iniciar o áudio devido às políticas do navegador.");
                });
            }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tetoPlaylist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audioElement.play();
            }
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tetoPlaylist.length) % tetoPlaylist.length;
            loadTrack(currentTrackIndex);
            if (isPlaying) {
                audioElement.play();
            }
        }

        function toggleMute() {
            const volumeIcon = document.getElementById('volume-icon');
            if (audioElement.muted) {
                audioElement.muted = false;
                volumeIcon.className = 'fa-solid fa-volume-high';
            } else {
                audioElement.muted = true;
                volumeIcon.className = 'fa-solid fa-volume-xmark text-red-500';
            }
        }

        function toggleMinimizePlayer() {
            const card = document.getElementById('player-card');
            const minimized = document.getElementById('player-minimized');
            card.classList.toggle('hidden');
            minimized.classList.toggle('hidden');
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        // ================================================================

        // Carrega Lista Inicial de Pokémon
        async function fetchPokemonList() {
            if (isLoading) return;
            isLoading = true;
            if (loadingContainer) loadingContainer.classList.remove('hidden');

            try {
                const response = await fetch(`${POKEAPI_BASE}/pokemon?limit=${LIMIT}&offset=${offset}`);
                const data = await response.json();

                // Buscar detalhes completos de cada pokemon retornado
                const detailPromises = data.results.map(pokemon => fetch(pokemon.url).then(res => res.json()));
                const pokemonDetails = await Promise.all(detailPromises);

                allLoadedPokemon.push(...pokemonDetails);
                renderGrid(allLoadedPokemon);

                offset += LIMIT;
                if (loadedCount) loadedCount.innerText = allLoadedPokemon.length;

                if (loadMoreBtn) loadMoreBtn.classList.remove('hidden');
            } catch (error) {
                console.error("Erro ao carregar lista de pokémon:", error);
            } finally {
                isLoading = false;
                if (loadingContainer) loadingContainer.classList.add('hidden');
            }
        }

        // Carregar mais Pokémon quando clicar no botão
        function loadMorePokemon() {
            fetchPokemonList();
        }

        // Renderiza a Grade de Cards dos Pokémon
        function renderGrid(pokemonList) {
            grid.innerHTML = '';

            if (pokemonList.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-teto-glass rounded-2xl border border-teto-border">
                        <i class="fa-regular fa-face-frown text-4xl text-teto-red mb-3"></i>
                        <p class="font-orbitron text-xl text-white">Nenhum Pokémon encontrado!</p>
                        <p class="text-sm text-gray-400 mt-1">Tente pesquisar outro nome ou ID.</p>
                    </div>
                `;
                return;
            }

            pokemonList.forEach(pokemon => {
                const card = createPokemonCard(pokemon);
                grid.appendChild(card);
            });
        }

        // Cria o elemento HTML de um Card Individual
        function createPokemonCard(pokemon) {
            const card = document.createElement('div');
            card.className = 'bg-teto-glassCard backdrop-blur-md border border-teto-border rounded-2xl p-4 card-hover neon-border-hover cursor-pointer flex flex-col justify-between relative overflow-hidden group';
            card.onclick = () => openPokemonModal(pokemon.id);

            // Sprite Oficial ou Fallback
            const sprite = pokemon.sprites.other['official-artwork'].front_default || 
                           pokemon.sprites.front_default || 
                           'https://via.placeholder.com/150?text=No+Image';

            // Formatação do ID (#001)
            const formattedId = `#${String(pokemon.id).padStart(3, '0')}`;

            // Tipos
            const typesHTML = pokemon.types.map(t => {
                return `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold uppercase tracking-wider type-${t.type.name}">${t.type.name}</span>`;
            }).join('');

            // Status Rápidos (HP e ATK)
            const hpStat = pokemon.stats.find(s => s.stat.name === 'hp')?.base_stat || 0;
            const atkStat = pokemon.stats.find(s => s.stat.name === 'attack')?.base_stat || 0;

            card.innerHTML = `
                <!-- Fundo decorativo neon -->
                <div class="absolute -right-10 -bottom-10 w-28 h-28 bg-teto-red/10 rounded-full blur-xl group-hover:bg-teto-red/30 transition-all"></div>

                <div>
                    <!-- ID e Nome -->
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-orbitron text-xs text-teto-red font-bold px-2 py-0.5 bg-black/50 rounded border border-teto-border/50">${formattedId}</span>
                        <i class="fa-solid fa-chevron-right text-xs text-teto-red opacity-0 group-hover:opacity-100 transition-opacity"></i>
                    </div>

                    <!-- Imagem do Pokémon -->
                    <div class="my-2 h-36 flex items-center justify-center p-2">
                        <img src="${sprite}" alt="${pokemon.name}" class="max-h-full max-w-full object-contain drop-shadow-[0_4px_10px_rgba(0,0,0,0.6)] group-hover:scale-110 transition-transform duration-300" loading="lazy">
                    </div>

                    <!-- Nome -->
                    <h3 class="font-orbitron text-xl font-extrabold text-white capitalize tracking-wide mb-2 text-center group-hover:text-teto-red transition-colors">${pokemon.name}</h3>

                    <!-- Tipos -->
                    <div class="flex flex-wrap gap-1.5 justify-center mb-4">
                        ${typesHTML}
                    </div>
                </div>

                <!-- Resumo de Atributos -->
                <div class="grid grid-cols-2 gap-2 text-xs bg-black/40 p-2 rounded-xl border border-teto-border/30">
                    <div class="text-center">
                        <span class="text-gray-400 block">HP</span>
                        <span class="font-orbitron text-white font-bold">${hpStat}</span>
                    </div>
                    <div class="text-center border-l border-teto-border/30">
                        <span class="text-gray-400 block">ATK</span>
                        <span class="font-orbitron text-white font-bold">${atkStat}</span>
                    </div>
                </div>
            `;

            return card;
        }

        // Função de Pesquisa
        async function handleSearch() {
            const query = searchInput.value.trim().toLowerCase();

            if (query.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
                renderGrid(allLoadedPokemon);
                return;
            }

            // Pesquisar localmente entre os já carregados
            const localFiltered = allLoadedPokemon.filter(p => 
                p.name.toLowerCase().includes(query) || p.id.toString() === query
            );

            if (localFiltered.length > 0) {
                renderGrid(localFiltered);
            } else if (query.length >= 2) {
                // Tentar buscar na PokéAPI se não encontrado nos carregados
                try {
                    const response = await fetch(`${POKEAPI_BASE}/pokemon/${query}`);
                    if (response.ok) {
                        const searchedPokemon = await response.json();
                        renderGrid([searchedPokemon]);
                    } else {
                        renderGrid([]);
                    }
                } catch (e) {
                    renderGrid([]);
                }
            }
        }

        function clearSearch() {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderGrid(allLoadedPokemon);
        }

        function resetSearch() {
            clearSearch();
            document.getElementById('type-filter').value = 'all';
        }

        // Filtro por Tipo
        function filterByType() {
            const selectedType = document.getElementById('type-filter').value;
            if (selectedType === 'all') {
                renderGrid(allLoadedPokemon);
                return;
            }

            const filtered = allLoadedPokemon.filter(pokemon => 
                pokemon.types.some(t => t.type.name === selectedType)
            );
            renderGrid(filtered);
        }

        // ABRIR MODAL DE DETALHES COMPLETO V2.0
        async function openPokemonModal(pokemonId) {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Impede scroll no fundo

            const modalLoading = document.getElementById('modal-loading');
            const modalContent = document.getElementById('modal-content');

            modalLoading.classList.remove('hidden');
            modalContent.classList.add('hidden');

            // Resetar estados
            isShinyMode = false;
            updateShinyUI();

            try {
                // Obter dados básicos e da espécie
                const pokemonData = await fetch(`${POKEAPI_BASE}/pokemon/${pokemonId}`).then(res => res.json());
                
                let speciesData = null;
                try {
                    speciesData = await fetch(pokemonData.species.url).then(res => res.json());
                } catch(e) {
                    speciesData = null;
                }

                currentSpeciesData = speciesData;
                currentVarietyData = pokemonData;

                // Popular Seletor de Variedades (Formas, Megas, Gigantamax)
                populateVarietiesSelect(speciesData, pokemonData.name);

                // Renderizar a Variedade Atual
                renderVarietyData(pokemonData);

                // Exibir Conteúdo
                modalLoading.classList.add('hidden');
                modalContent.classList.remove('hidden');

            } catch (error) {
                console.error("Erro ao carregar detalhes do Pokémon:", error);
                closeModal();
            }
        }

        // Popula o Dropdown de Formas e Variantes
        function populateVarietiesSelect(speciesData, currentPokemonName) {
            const select = document.getElementById('variety-select');
            select.innerHTML = '';

            if (!speciesData || !speciesData.varieties || speciesData.varieties.length <= 1) {
                select.innerHTML = `<option value="${currentPokemonName}">Forma Padrão</option>`;
                return;
            }

            speciesData.varieties.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.pokemon.name;
                
                // Formatação legível do nome da forma (ex: charizard-mega-x -> Mega X)
                let rawName = v.pokemon.name;
                let displayName = rawName.replace('-', ' ');
                if (v.is_default) {
                    displayName = "Padrão";
                } else {
                    displayName = displayName.replace(speciesData.name, '').trim();
                    if (displayName === '') displayName = rawName;
                }

                opt.innerText = displayName.toUpperCase();
                if (v.pokemon.name === currentPokemonName) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        // Muda a Forma selecionada via Dropdown
        async function changeVariety(varietyName) {
            if (!varietyName) return;
            
            const modalLoading = document.getElementById('modal-loading');
            const modalContent = document.getElementById('modal-content');

            modalLoading.classList.remove('hidden');
            modalContent.classList.add('hidden');

            try {
                const varietyData = await fetch(`${POKEAPI_BASE}/pokemon/${varietyName}`).then(res => res.json());
                currentVarietyData = varietyData;
                renderVarietyData(varietyData);
            } catch (error) {
                console.error("Erro ao trocar variedade:", error);
            } finally {
                modalLoading.classList.add('hidden');
                modalContent.classList.remove('hidden');
            }
        }

        // Renderiza as informações de uma determinada variedade do Pokémon
        function renderVarietyData(pokemonData) {
            // Configurar Sprites (Normal vs Shiny)
            updateSprites(pokemonData);

            document.getElementById('modal-id').innerText = `#${String(pokemonData.id).padStart(3, '0')}`;
            document.getElementById('modal-name').innerText = pokemonData.name.replace('-', ' ');

            // Tipos
            const typesContainer = document.getElementById('modal-types');
            typesContainer.innerHTML = pokemonData.types.map(t => 
                `<span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider type-${t.type.name}">${t.type.name}</span>`
            ).join('');

            // Descrição da Dex
            let flavorText = "Nenhuma descrição registrada para esta forma.";
            if (currentSpeciesData && currentSpeciesData.flavor_text_entries && currentSpeciesData.flavor_text_entries.length > 0) {
                const ptEntry = currentSpeciesData.flavor_text_entries.find(e => e.language.name === 'pt' || e.language.name === 'pt-BR');
                const enEntry = currentSpeciesData.flavor_text_entries.find(e => e.language.name === 'en');
                const entry = ptEntry || enEntry;
                if (entry) {
                    flavorText = entry.flavor_text.replace(/[\n\f]/g, ' ');
                }
            }
            document.getElementById('modal-description').innerText = `"${flavorText}"`;

            // Altura, Peso e Habilidades
            document.getElementById('modal-height').innerText = `${(pokemonData.height / 10).toFixed(1)} m`;
            document.getElementById('modal-weight').innerText = `${(pokemonData.weight / 10).toFixed(1)} kg`;
            
            const abilities = pokemonData.abilities.map(a => a.ability.name.replace('-', ' ')).join(', ');
            document.getElementById('modal-abilities').innerText = abilities || '--';

            // Preencher Status Base
            renderModalStats(pokemonData.stats);

            // Preencher Ataques Aprendidos
            renderModalMoves(pokemonData.moves);
        }

        // Atualiza Lista de Sprites Disponíveis (Normal vs Shiny)
        function updateSprites(pokemonData) {
            const sprites = pokemonData.sprites;

            if (isShinyMode) {
                spriteUrls = [
                    sprites.other['official-artwork']?.front_shiny,
                    sprites.other['showdown']?.front_shiny || sprites.front_shiny,
                    sprites.front_shiny,
                    sprites.back_shiny
                ].filter(Boolean);
            } else {
                spriteUrls = [
                    sprites.other['official-artwork']?.front_default,
                    sprites.other['showdown']?.front_default || sprites.front_default,
                    sprites.front_default,
                    sprites.back_default
                ].filter(Boolean);
            }

            // Se não houver shiny disponível, tenta fallback para normal
            if (spriteUrls.length === 0) {
                spriteUrls = [
                    sprites.other['official-artwork']?.front_default || sprites.front_default
                ].filter(Boolean);
            }

            currentSpriteIndex = 0;
            document.getElementById('modal-img').src = spriteUrls[0] || 'https://via.placeholder.com/200?text=No+Image';
        }

        // Alterna entre modo Normal e Shiny
        function toggleShinyMode(shiny) {
            isShinyMode = shiny;
            updateShinyUI();

            if (currentVarietyData) {
                updateSprites(currentVarietyData);
            }
        }

        function updateShinyUI() {
            const btnNormal = document.getElementById('btn-normal-mode');
            const btnShiny = document.getElementById('btn-shiny-mode');
            const shinyBadge = document.getElementById('shiny-badge');

            if (isShinyMode) {
                btnShiny.className = "px-3 py-1 text-xs font-orbitron rounded-lg transition-all bg-yellow-500 text-black font-bold shadow-[0_0_10px_#eab308]";
                btnNormal.className = "px-3 py-1 text-xs font-orbitron rounded-lg transition-all text-gray-400 hover:text-white";
                shinyBadge.classList.remove('hidden');
            } else {
                btnNormal.className = "px-3 py-1 text-xs font-orbitron rounded-lg transition-all bg-teto-red text-white font-bold shadow";
                btnShiny.className = "px-3 py-1 text-xs font-orbitron rounded-lg transition-all text-gray-400 hover:text-white";
                shinyBadge.classList.add('hidden');
            }
        }

        // Alternar visualização da Sprite no Modal
        function toggleSpriteView() {
            if (spriteUrls.length <= 1) return;
            currentSpriteIndex = (currentSpriteIndex + 1) % spriteUrls.length;
            document.getElementById('modal-img').src = spriteUrls[currentSpriteIndex];
        }

        // Renderizar Status com barras de progresso estilo Kasane Teto Red
        function renderModalStats(stats) {
            const container = document.getElementById('modal-stats-container');
            container.innerHTML = '';

            const statNamesPt = {
                'hp': 'HP',
                'attack': 'Ataque',
                'defense': 'Defesa',
                'special-attack': 'Atq. Especial',
                'special-defense': 'Def. Especial',
                'speed': 'Velocidade'
            };

            const maxStat = 255;

            stats.forEach(stat => {
                const name = statNamesPt[stat.stat.name] || stat.stat.name;
                const value = stat.base_stat;
                const percentage = Math.min((value / maxStat) * 100, 100);

                const statRow = document.createElement('div');
                statRow.className = 'flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4';

                statRow.innerHTML = `
                    <span class="w-28 text-xs font-orbitron text-gray-300 uppercase">${name}</span>
                    <span class="w-10 text-sm font-bold font-orbitron text-teto-red text-right">${value}</span>
                    <div class="flex-grow bg-black/60 h-3 rounded-full overflow-hidden border border-teto-border/40 relative">
                        <div class="bg-gradient-to-r from-teto-darkred via-teto-red to-red-400 h-full rounded-full transition-all duration-700 shadow-[0_0_8px_#e60033]" style="width: ${percentage}%"></div>
                    </div>
                `;
                container.appendChild(statRow);
            });
        }

        // Renderizar Ataques Aprendidos
        function renderModalMoves(moves) {
            const container = document.getElementById('modal-moves-container');
            document.getElementById('moves-count').innerText = moves.length;
            container.innerHTML = '';

            if (moves.length === 0) {
                container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-4">Nenhum ataque registrado para esta variante.</p>`;
                return;
            }

            moves.slice(0, 60).forEach(m => {
                const moveName = m.move.name.replace('-', ' ');
                
                const versionDetails = m.version_group_details[m.version_group_details.length - 1];
                const level = versionDetails ? versionDetails.level_learned_at : 0;
                const method = versionDetails ? versionDetails.move_learn_method.name : 'other';

                let methodBadge = '';
                if (method === 'level-up') {
                    methodBadge = `<span class="text-[10px] bg-teto-red/30 border border-teto-red text-red-200 px-1.5 py-0.5 rounded">Nvl ${level}</span>`;
                } else if (method === 'machine') {
                    methodBadge = `<span class="text-[10px] bg-blue-900/40 border border-blue-500 text-blue-200 px-1.5 py-0.5 rounded">TM/HM</span>`;
                } else {
                    methodBadge = `<span class="text-[10px] bg-gray-800 border border-gray-600 text-gray-300 px-1.5 py-0.5 rounded capitalize">${method}</span>`;
                }

                const moveCard = document.createElement('div');
                moveCard.className = 'bg-black/40 border border-teto-border/40 p-2.5 rounded-lg flex items-center justify-between text-xs hover:border-teto-red transition-colors';
                
                moveCard.innerHTML = `
                    <span class="capitalize text-gray-200 font-semibold truncate mr-2">${moveName}</span>
                    ${methodBadge}
                `;

                container.appendChild(moveCard);
            });
        }

        // Troca de Abas no Modal (Status / Ataques)
        function switchTab(tab) {
            const statsTab = document.getElementById('tab-stats');
            const movesTab = document.getElementById('tab-moves');
            const statsBtn = document.getElementById('tab-stats-btn');
            const movesBtn = document.getElementById('tab-moves-btn');

            if (tab === 'stats') {
                statsTab.classList.remove('hidden');
                movesTab.classList.add('hidden');
                statsBtn.className = "px-6 py-2.5 font-orbitron text-sm tracking-wider font-bold border-b-2 border-teto-red text-teto-red focus:outline-none";
                movesBtn.className = "px-6 py-2.5 font-orbitron text-sm tracking-wider font-bold border-b-2 border-transparent text-gray-400 hover:text-white focus:outline-none";
            } else {
                statsTab.classList.add('hidden');
                movesTab.classList.remove('hidden');
                statsBtn.className = "px-6 py-2.5 font-orbitron text-sm tracking-wider font-bold border-b-2 border-transparent text-gray-400 hover:text-white focus:outline-none";
                movesBtn.className = "px-6 py-2.5 font-orbitron text-sm tracking-wider font-bold border-b-2 border-teto-red text-teto-red focus:outline-none";
            }
        }

        // Fechar Modal
        function closeModal() {
            if (modal) {
                modal.classList.add('hidden');
            }
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
